# Configuration Render (Blueprint) — site statique Fanni's Store
# Aucun build ni variable d'environnement nécessaire : tout se règle dans assets/js/data.js
services:
  - type: web
    name: fannis-store
    runtime: static
    buildCommand: echo "Site statique, aucun build nécessaire"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
