# Configuration Render (Blueprint) — Fanni's Store (site + espace admin)
# Service Node.js : sert le site public et l'administration (/admin).
services:
  - type: web
    name: fannis-store
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL        # base PostgreSQL (Neon, Supabase ou Render)
        sync: false
      - key: ADMIN_EMAIL         # email de connexion à /admin
        sync: false
      - key: ADMIN_PASSWORD      # mot de passe de connexion à /admin
        sync: false
      - key: SESSION_SECRET      # généré automatiquement par Render
        generateValue: true
      - key: PUBLIC_URL          # ex. https://www.fannis-store.com
        sync: false
